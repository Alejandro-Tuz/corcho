[project]
name = "corcho-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2",
    "redis>=5",
    "websockets",
    "python-dotenv>=1",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "httpx", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# B008 ("no llamar a una función en un default de argumento") no aplica a
# `Depends`/`Query`/etc.: es el patrón estándar de FastAPI para declarar
# dependencias, no una llamada costosa reevaluada en cada import.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]